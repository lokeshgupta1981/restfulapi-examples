# Shared by openapi.yaml and asyncapi.yaml.
# Uses only keywords that mean the same in JSON Schema Draft 07
# (AsyncAPI Schema Object) and 2020-12 (OpenAPI 3.1+).
type: object
required: [id, customerId, items, total, currency, status, createdAt]
properties:
  id:
    type: string
    pattern: "^ord_[0-9a-z]{8}$"
    examples: ["ord_1a2b3c4d"]
  customerId:
    type: string
    examples: ["cus_42"]
  items:
    type: array
    minItems: 1
    items:
      $ref: "./order-item.yaml"
  total:
    type: string
    pattern: "^[0-9]+\\.[0-9]{2}$"
    description: Order total as a decimal string, for example "59.90".
  currency:
    type: string
    pattern: "^[A-Z]{3}$"
  status:
    type: string
    enum: [pending, paid, shipped, cancelled]
  createdAt:
    type: string
    format: date-time
