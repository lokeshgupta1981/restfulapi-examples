worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log warn;

events {
    worker_connections 64;
}

http {
    client_body_temp_path tmp/client_body;
    proxy_temp_path tmp/proxy;
    fastcgi_temp_path tmp/fastcgi;
    uwsgi_temp_path tmp/uwsgi;
    scgi_temp_path tmp/scgi;

    log_format upstream '$remote_addr "$request" status=$status '
                        'upstream=$upstream_addr upstream_status=$upstream_status '
                        'upstream_time=$upstream_response_time request_id=$request_id';
    access_log logs/access.log upstream;

    upstream orders_api {
        server 127.0.0.1:9502;
        keepalive 8;
    }

    # Port 8502: nginx defaults, so we can see the stock HTML error page.
    server {
        listen 127.0.0.1:8502;

        location / {
            proxy_pass http://orders_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
        }

        # The fix for case 4: a bigger buffer for the response header.
        location /fail/huge-header {
            proxy_pass http://orders_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffer_size 32k;
            proxy_buffers 8 32k;
            proxy_busy_buffers_size 64k;
        }
    }

    # Port 8503: the same proxy, but HTTP 502 comes back as Problem Details JSON.
    server {
        listen 127.0.0.1:8503;

        location / {
            proxy_pass http://orders_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            error_page 502 = @bad_gateway;
        }

        location @bad_gateway {
            default_type application/problem+json;
            add_header Retry-After 5 always;
            add_header X-Request-Id $request_id always;
            return 502 '{"type":"https://example.com/problems/upstream-unavailable","title":"Bad Gateway","status":502,"detail":"The orders service did not return a valid response. Try again in a few seconds.","instance":"$request_uri","request_id":"$request_id"}\n';
        }
    }
}
