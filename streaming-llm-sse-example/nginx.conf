# Minimal nginx in front of the API, to see proxy buffering.
# Both locations use nginx defaults: proxy_buffering on, and (before nginx 1.29.7)
# HTTP/1.0 to the upstream. They differ only in proxy_ignore_headers.
# Run from this folder: nginx -p "$PWD" -c nginx.conf   (stop: nginx -p "$PWD" -c nginx.conf -s stop)
worker_processes 1;
pid nginx.pid;
error_log nginx-error.log;
events {}

http {
    access_log off;
    # Keep the temp folders inside this project folder.
    client_body_temp_path tmp/body;
    proxy_temp_path tmp/proxy;
    fastcgi_temp_path tmp/fastcgi;
    uwsgi_temp_path tmp/uwsgi;
    scgi_temp_path tmp/scgi;

    server {
        listen 9380;

        # Normal route: the app's "X-Accel-Buffering: no" header turns buffering off.
        location / {
            proxy_pass http://127.0.0.1:9300;
        }

        # Same app, but nginx ignores that header and buffers as it does by default.
        location /buffered/ {
            proxy_pass http://127.0.0.1:9300/;
            proxy_ignore_headers X-Accel-Buffering;
        }
    }
}
