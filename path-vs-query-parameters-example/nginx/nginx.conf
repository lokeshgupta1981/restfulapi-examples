# Reverse proxy with a small cache in front of the FastAPI app.
# Start from the example folder: nginx -p "$PWD/nginx" -c nginx.conf
# large_client_header_buffers and proxy_cache_key keep their nginx defaults.
worker_processes 1;
pid nginx.pid;
error_log error.log;

events {
    worker_connections 64;
}

http {
    access_log access.log;
    client_body_temp_path tmp/body;
    proxy_temp_path tmp/proxy;
    fastcgi_temp_path tmp/fastcgi;
    uwsgi_temp_path tmp/uwsgi;
    scgi_temp_path tmp/scgi;

    proxy_cache_path cache levels=1:2 keys_zone=api:1m max_size=10m;

    server {
        listen 8481;

        location / {
            proxy_pass http://127.0.0.1:8480;
            proxy_cache api;
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }
}
