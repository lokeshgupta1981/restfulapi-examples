worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log warn;

events {
    worker_connections 64;
}

http {
    client_body_temp_path tmp/client_body;
    proxy_temp_path tmp/proxy;
    fastcgi_temp_path tmp/fastcgi;
    uwsgi_temp_path tmp/uwsgi;
    scgi_temp_path tmp/scgi;

    log_format timing '"$request" status=$status upstream_status=$upstream_status '
                      'upstream_connect_time=$upstream_connect_time '
                      'upstream_header_time=$upstream_header_time request_time=$request_time';
    access_log logs/access.log timing;

    server {
        listen 127.0.0.1:8504;

        # Demo values. The nginx default for both is 60s.
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        error_page 504 = @gateway_timeout;

        location / {
            proxy_pass http://127.0.0.1:9504;
        }

        # A known slow endpoint gets its own, longer read timeout.
        location /reports/yearly {
            proxy_pass http://127.0.0.1:9504;
            proxy_read_timeout 10s;
        }

        # A second upstream that never accepts the TCP connection.
        location /legacy/ {
            proxy_pass http://127.0.0.1:9505;
        }

        location @gateway_timeout {
            default_type application/problem+json;
            add_header X-Request-Id $request_id always;
            return 504 '{"type":"https://example.com/problems/upstream-timeout","title":"Gateway Timeout","status":504,"detail":"The orders service did not answer within the gateway time limit.","instance":"$request_uri","request_id":"$request_id"}\n';
        }
    }
}
