# nginx in front of the example server (tested with nginx 1.24.0).
# Put the map and the server block inside the http { } block of nginx.conf.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream orders_app {
    server 127.0.0.1:9150;
}

server {
    listen 443 ssl http2;            # nginx 1.25.1+: "listen 443 ssl;" plus "http2 on;"
    server_name orders.example.com;
    ssl_certificate     /etc/nginx/certs/orders.crt;
    ssl_certificate_key /etc/nginx/certs/orders.key;

    location / {
        proxy_pass http://orders_app;
        proxy_http_version 1.1;      # default only since nginx 1.29.7
        proxy_set_header Host $host;
    }

    # Long polling: the app answers within 25 s, so the default 60 s read timeout is enough.

    # Server-sent events: no buffering, no compression, long read timeout.
    location ~ ^/orders/[^/]+/stream$ {
        proxy_pass http://orders_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;         # the app also sends X-Accel-Buffering: no
        gzip off;
        proxy_read_timeout 1h;       # the app sends a comment line every 15 s anyway
    }

    # WebSocket: pass the Upgrade handshake to the app.
    location ~ ^/orders/[^/]+/socket$ {
        proxy_pass http://orders_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;       # uvicorn also sends a ping every 20 s
    }
}
