openapi: 3.1.0
info:
  title: Orders API
  version: 1.0.0
  description: The same orders API after applying our house style guide (rulesets/house.spectral.yaml).
servers:
  - url: https://api.example.com
paths:
  /v1/orders:
    get:
      operationId: listOrders
      summary: List orders, one page at a time
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: One page of orders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPage' }
        '400':
          $ref: '#/components/responses/Error'
    post:
      operationId: createOrder
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Order' }
      responses:
        '201':
          description: The created order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400':
          $ref: '#/components/responses/Error'
  /v1/orders/{orderId}:
    get:
      operationId: getOrder
      summary: Get one order
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404':
          $ref: '#/components/responses/Error'
  /v1/orders/{orderId}:cancel:
    post:
      operationId: cancelOrder
      summary: Cancel an order
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The cancelled order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409':
          $ref: '#/components/responses/Error'
  /v1/orders/{orderId}/line-items:
    get:
      operationId: listLineItems
      summary: List the line items of an order
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: One page of line items
          content:
            application/json:
              schema:
                type: object
                properties:
                  lineItems:
                    type: array
                    items: { $ref: '#/components/schemas/LineItem' }
                  nextPageToken: { type: string }
        '404':
          $ref: '#/components/responses/Error'
components:
  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100 }
    PageToken:
      name: pageToken
      in: query
      schema: { type: string }
  responses:
    Error:
      description: Something went wrong
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Order:
      type: object
      properties:
        id: { type: string, readOnly: true }
        customerId: { type: string }
        status: { type: string, enum: [pending, paid, cancelled] }
        totalAmount: { type: string, example: '49.90' }
        createdAt: { type: string, format: date-time, readOnly: true }
    LineItem:
      type: object
      properties:
        sku: { type: string }
        quantity: { type: integer, minimum: 1 }
    OrderPage:
      type: object
      properties:
        orders:
          type: array
          items: { $ref: '#/components/schemas/Order' }
        nextPageToken: { type: string }
    Problem:
      description: Problem Details for HTTP APIs (RFC 9457)
      type: object
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
