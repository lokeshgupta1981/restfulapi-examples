openapi: 3.1.0
info:
  title: Orders API
  version: 1.0.0
  description: A small orders API written the way many teams write their first API.
servers:
  - url: https://api.example.com
paths:
  /v1/orders:
    get:
      operationId: listOrders
      summary: List orders, one page at a time
      parameters:
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: pageToken
          in: query
          schema: { type: string }
      responses:
        '200':
          description: One page of orders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPage' }
        '400':
          $ref: '#/components/responses/Error'
    post:
      operationId: createOrder
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Order' }
      responses:
        '201':
          description: The created order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400':
          $ref: '#/components/responses/Error'
  /v1/orders/{orderId}:
    get:
      operationId: getOrder
      summary: Get one order
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404':
          $ref: '#/components/responses/Error'
  /v1/orders/{orderId}/cancel:
    post:
      operationId: cancelOrder
      summary: Cancel an order
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The cancelled order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409':
          $ref: '#/components/responses/Error'
  /v1/orders/{orderId}/line-items:
    get:
      operationId: listLineItems
      summary: List the line items of an order
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The line items
          content:
            application/json:
              schema:
                type: object
                properties:
                  lineItems:
                    type: array
                    items: { $ref: '#/components/schemas/LineItem' }
        '404':
          $ref: '#/components/responses/Error'
components:
  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Something went wrong
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Order:
      type: object
      properties:
        id: { type: string, readOnly: true }
        customerId: { type: string }
        status: { type: string, enum: [pending, paid, cancelled] }
        totalAmount: { type: string, example: '49.90' }
        createdAt: { type: string, format: date-time, readOnly: true }
    LineItem:
      type: object
      properties:
        sku: { type: string }
        quantity: { type: integer, minimum: 1 }
    OrderPage:
      type: object
      properties:
        orders:
          type: array
          items: { $ref: '#/components/schemas/Order' }
        nextPageToken: { type: string }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
