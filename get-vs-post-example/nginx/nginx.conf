# Start from the project folder:
#   nginx -p "$PWD/nginx" -c nginx.conf
worker_processes 1;
pid nginx.pid;
error_log logs/error.log;

events {}

http {
    access_log logs/access.log combined;
    client_body_temp_path temp/body;
    proxy_temp_path temp/proxy;
    fastcgi_temp_path temp/fastcgi;
    uwsgi_temp_path temp/uwsgi;
    scgi_temp_path temp/scgi;

    proxy_cache_path cache keys_zone=orders_cache:1m;

    # First server drops every connection; the app is the backup.
    upstream flaky_pool {
        server 127.0.0.1:9122 max_fails=0;
        server 127.0.0.1:9120 backup;
    }

    server {
        listen 127.0.0.1:9121;

        # Caching proxy in front of the Orders API.
        location /orders {
            proxy_pass http://127.0.0.1:9120;
            proxy_cache orders_cache;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        # Same API behind an upstream pool whose first server fails.
        location /pool/ {
            proxy_pass http://flaky_pool/;
        }

        location / {
            proxy_pass http://127.0.0.1:9120;
        }
    }
}
