# Copy to .github/workflows/mock-contract.yml in a repository that has
# this folder at its root. The job fails when ci.sh exits with a non-zero code.
name: mock-and-contract
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: bash ci.sh
